<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>OpenW clip saved</title>
  <style>
    @font-face { font-family: "Outfit"; src: url("../../assets/fonts/outfit.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "DM Sans"; src: url("../../assets/fonts/dm-sans.woff2") format("woff2"); font-weight: 100 1000; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: #f1f2f4; font: 13px/1.3 "DM Sans", "Segoe UI", sans-serif; }
    body { display: flex; justify-content: center; align-items: center; }
    #note { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 18px 0 10px; border-radius: 16px; background: rgba(14, 15, 18, .9); border: 1px solid rgba(255, 255, 255, .1);
      opacity: 0; transform: translateY(-10px) scale(.98); transition: opacity .25s, transform .35s cubic-bezier(.2, .8, .2, 1); }
    #note.in { opacity: 1; transform: none; }
    #dot { width: 34px; height: 34px; border-radius: 11px; background: #00d8c8; display: grid; place-items: center; flex: none; }
    #dot svg { width: 18px; height: 18px; stroke: #03211f; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    #note.bad #dot { background: #fb7185; }
    #title { font: 600 14px/1.2 "Outfit", sans-serif; }
    #sub { color: #9da2ad; font-size: 12px; }
  </style>
</head>
<body>
  <div id="note"><div id="dot"><svg viewBox="0 0 24 24"><path d="M5 12l5 5l9-10"/></svg></div><div><div id="title"></div><div id="sub"></div></div></div>
  <script src="cliptoast.js"></script>
</body>
</html>
