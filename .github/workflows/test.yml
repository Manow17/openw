# The tests on every pull request (and on demand), so whoever merges sees whether a change
# breaks anything before it is released. Tests that need Rocket League installed are skipped here.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
