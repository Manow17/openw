# Claude on issues and pull requests: write "@claude" (in a new issue, or in a comment on an
# issue or pull request) and Claude works on it, pushes a branch and leaves a link to open a
# pull request. Only the repository's owner and its collaborators can start it: anyone can open
# an issue on a public repository, and issue text is not trusted (see CLAUDE.md).
# Claude can only push its own branch; nothing reaches main (and so no release, see
# release.yml) until someone with write access merges the pull request.
# Needs: the Claude GitHub app installed on the repository, and the secret CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`) or ANTHROPIC_API_KEY.
name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' &&
        contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.issue.author_association) &&
        contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' &&
        contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the fix branch
      pull-requests: write   # open and update pull requests
      issues: write          # answer on the issue
      id-token: write        # sign in as the Claude GitHub app
      actions: read          # read the test results
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model claude-opus-5-5
          # with an API key instead of a Claude subscription, use this line in place of the one above:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
